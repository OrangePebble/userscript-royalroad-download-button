<div class="w-1/4 md:w-auto flex-shrink-0">
  <div class="relative font-light group flex flex-col w-full md:w-auto">
    <div
      class="group"
      tabindex="0"
      role="button"
      aria-haspopup="menu"
      aria-expanded="false"
    >
      <button
        id="orangepebble-form-toggle"
        type="button"
        class="inline-flex items-center gap-2 cursor-pointer whitespace-nowrap rounded-theme font-medium tracking-wide text-center active:opacity-100 disabled:opacity-55 disabled:cursor-not-allowed no-underline transform active:scale-90 motion-reduce:transition-none transition-all duration-150 bg-secondary text-on-secondary hover:brightness-110 hover:text-on-surface-strong hover:shadow-md focus-visible:ring-2 focus-visible:ring-secondary focus-visible:ring-offset-2 focus-visible:outline-none px-4 py-2 text-md w-full h-14 justify-center border border-on-surface/20"
        aria-label="Download"
        tabindex="0"
      >
        <span class="md:hidden text-xs">Download</span>
        <i class="fa-solid fa-download"></i>
      </button>
    </div>

    <form
      id="orangepebble-form"
      class="form-group hidden absolute w-fit flex-col overflow-hidden rounded-md bg-surface-alt border-1 shadow-on-surface/40 dark:shadow-primary/15 border-on-surface/25 dark:bg-surface-dark-alt shadow-lg z-50 top-full left-0 mt-1 flex gap-6 pb-5 px-5 pt-3"
      style="position: fixed; width: 400px"
    >
      <div class="space-y-2">
        <label
          for="orangepebble-fiction-file-input"
          class="block text-sm font-semibold text-on-surface-strong tracking-wider"
        >
          Select a fiction file to extend with new chapters
        </label>
        <style>
          #orangepebble-form input[type="file"]::file-selector-button {
            color: var(--text-on-surface);
            background-color: color-mix(
              in oklab,
              var(--color-surface) 30%,
              transparent
            );
            border-color: color-mix(
              in oklab,
              var(--color-on-surface) 20%,
              transparent
            );
            border-style: var(--tw-border-style);
            border-width: 1px;
            border-radius: var(--border-radius);
            cursor: pointer;
            font-weight: var(--font-weight-medium);
            padding-block: var(--spacing);
            padding-inline: calc(var(--spacing) * 2);
            margin-right: calc(var(--spacing) * 2);
            transition-duration: 0.2s;
          }
          #orangepebble-form input[type="file"]::file-selector-button:hover {
            background-color: color-mix(
              in oklab,
              var(--color-surface) 65%,
              transparent
            );
          }
          #orangepebble-form input[type="file"]:active::file-selector-button {
            scale: 90% 90%;
          }
        </style>
        <input
          id="orangepebble-fiction-file-input"
          type="file"
          class="text-on-surface-strong mb-0"
          style="display: block; width: 100%"
        />
        <label
          for="orangepebble-update-metadata-checkbox"
          class="inline-flex items-center gap-3 peer mb-0 text-on-surface-strong"
          hidden
          ><input
            id="orangepebble-update-metadata-checkbox"
            type="checkbox"
            class="peer sr-only"
            role="checkbox"
            value="true"
            checked
          />
          <div
            class="h-6 min-w-11 w-11 after:h-5 after:w-5 peer-checked:after:translate-x-5 relative rounded-full after:absolute after:bottom-0 after:top-0 after:my-auto after:rounded-full after:transition-all after:content-[''] after:left-[0.0625rem] bg-on-surface-strong/50 transition-colors after:bg-surface-alt peer-checked:bg-on-surface-strong peer-focus:outline-2 peer-focus:outline-offset-2 peer-focus:outline-outline-strong peer-focus:peer-checked:outline-primary peer-active:outline-offset-0 peer-disabled:cursor-not-allowed peer-disabled:opacity-70"
            aria-hidden="true"
          ></div>
          Update metadata</label
        >
      </div>
      <div class="space-y-2">
        <label
          for="orangepebble-start-chapter-select"
          class="block text-sm font-semibold text-on-surface-strong tracking-wider"
        >
          Select the start chapter
        </label>
        <select
          id="orangepebble-start-chapter-select"
          class="inline-flex items-center justify-center gap-2 cursor-pointer whitespace-nowrap rounded-theme font-medium tracking-wide text-center active:opacity-100 hover:shadow-sm disabled:opacity-55 disabled:cursor-not-allowed no-underline transform active:scale-90 motion-reduce:transition-none bg-surface/30 hover:bg-surface/65 hover:brightness-125 text-on-surface-strong border border-on-surface/20 transition-all duration-200 focus-visible:ring-2 focus-visible:ring-on-surface/50 focus-visible:ring-offset-2 focus-visible:outline-none px-4 py-2 text-md text-left"
          style="width: 100%; text-overflow: ellipsis"
        ></select>
      </div>
      <div class="space-y-2">
        <label
          for="orangepebble-end-chapter-select"
          class="block text-sm font-semibold text-on-surface-strong tracking-wider"
        >
          Select the end chapter
        </label>
        <select
          id="orangepebble-end-chapter-select"
          class="inline-flex items-center justify-center gap-2 cursor-pointer whitespace-nowrap rounded-theme font-medium tracking-wide text-center active:opacity-100 hover:shadow-sm disabled:opacity-55 disabled:cursor-not-allowed no-underline transform active:scale-90 motion-reduce:transition-none bg-surface/30 hover:bg-surface/65 hover:brightness-125 text-on-surface-strong border border-on-surface/20 transition-all duration-200 focus-visible:ring-2 focus-visible:ring-on-surface/50 focus-visible:ring-offset-2 focus-visible:outline-none px-4 py-2 text-md text-left"
          style="width: 100%; text-overflow: ellipsis"
        ></select>
      </div>
    </form>
  </div>
</div>
