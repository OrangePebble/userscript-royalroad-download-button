<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <style>
      html {
        --padding: 0.25rem;
        --spacing: 0.25rem;
        --color-on-surface: #fffc;
        --color-on-surface-strong: #fff;
        --font-weight-light: 300;
        --text-base: 1rem;
        --text-xl: 1.25rem;
        --text-2xl: 1.5rem;
        --text-3xl: 1.875rem;
        --leading-tight: 1.25;
        --tracking-tight: -0.025em;
        --font-weight-semibold: 600;
        --font-weight-medium: 500;
        --color-surface: #181818;
        --radius-xs: 0.125rem;
        --color-primary: oklch(56.35% 0.1182 247.74);
        --color-on-primary: oklch(100% 0 0);
        --radius-sm: 0.25rem;
        --border-radius: var(--radius-sm);
        --color-on-secondary: #fffc;
        --tracking-wide: 0.025em;
        --text-base--line-height: calc(1.5/1);
        --color-surface-alt: #131313;
        --radius-md: 0.375rem;
        --color-on-surface-muted: oklch(55.6% 0 0);
        --font-weight-bold: 700;
        --color-table: #00436f;
      }
      body {
        background: var(--color-surface);
        font-family: sans-serif;
        line-height: var(--text-base--line-height);
        font-size: var(--text-base);
        margin: 0;
      }
      body > div {
        margin-left: auto;
        margin-right: auto;
        width: 100%;
        min-height: calc(100vh - 25.65rem);
      }
      #header {
        padding-block: calc(var(--padding) * 4);
        padding-inline: calc(var(--padding) * 6);
        min-height: calc(11rem - var(--padding) * 8);
        display: flex;
        flex-direction: column;
        justify-content: flex-start;
        gap: calc(var(--spacing) * 1.5);
        box-shadow:
          rgba(0, 0, 0, 0) 0px 0px 0px 0px,
          rgba(0, 0, 0, 0) 0px 0px 0px 0px,
          rgba(0, 0, 0, 0) 0px 0px 0px 0px,
          rgba(0, 0, 0, 0) 0px 0px 0px 0px,
          oklab(0 0 0 / 0.3) 0px 4px 6px 0px;
      }
      #fiction-title {
        h2 {
          color: var(--color-on-surface-strong);
          white-space: nowrap;
          overflow: hidden;
          text-overflow: ellipsis;
          font-weight: var(--font-weight-light);
          font-size: var(--text-xl);
          line-height: var(--leading-tight);
          letter-spacing: var(--tracking-tight);
          margin: 0;
        }
      }
      #chapter-title {
        h1 {
          color: var(--color-on-surface-strong);
          font-weight: var(--font-weight-semibold);
          font-size: var(--text-2xl);
          line-height: var(--leading-tight);
          margin: 0;
        }
      }
      #author {
        margin-top: auto;
        h4 {
          color: var(--color-on-surface-strong);
          font-weight: var(--font-weight-medium);
          font-size: var(--text-base);
          line-height: var(--leading-tight);
          white-space: nowrap;
          overflow: hidden;
          text-overflow: ellipsis;
          margin: 0;
          background-color: color-mix(
            in oklab,
            var(--color-surface) 40%,
            transparent
          );
          padding-block: calc(var(--spacing) * 3);
          padding-inline: calc(var(--spacing) * 4.5);
          border-radius: var(--radius-xs);
          border-color: color-mix(
            in oklab,
            var(--color-on-surface) 10%,
            transparent
          );
          border-width: 1px;
          border-style: solid;
        }
      }
      #body {
        margin-block: calc(var(--padding) * 6);
        margin-inline: calc(var(--padding) * 2);
        padding-block: calc(var(--spacing) * 4);
        padding-inline: calc(var(--spacing) * 3);
        background-color: var(--color-surface-alt);
        border-color: color-mix(
          in oklab,
          var(--color-on-surface) 20%,
          transparent
        );
        border-width: 1px;
        border-style: solid;
        border-radius: var(--radius-md);
        color: var(--color-on-surface);
        display: flex;
        flex-direction: column;
        gap: calc(var(--spacing) * 4);
      }
      p {
        font-size: 15px;
        margin-bottom: 1em;
        margin-top: 0;
      }
      img {
        max-width: 100%;
        height: auto;
        vertical-align: middle;
      }
      table {
        background: var(--color-table);
        margin: 10px auto;
        width: 90%;
        border: none;
        box-shadow: 1px 1px 1px #000000bf;
        border-collapse: separate;
        border-spacing: 2px;
        text-indent: 0;
      }
      td {
        padding: 5px;
        color: var(--color-on-primary);
        border: 1px solid rgba(255, 255, 255, 0.25) !important;
        background: #0000001a;
      }
      #start-note,
      #end-note {
        padding: calc(var(--spacing) * 4);
        background-color: color-mix(
          in oklab,
          var(--color-primary) 30%,
          transparent
        );
        border-radius: var(--radius-sm);
      }
      #start-note::before,
      #end-note::before {
        content: "🗈 A NOTE FROM THE AUTHOR";
        font-weight: var(--font-weight-bold);
      }
      #top-nav-buttons,
      #bottom-nav-buttons {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: calc(var(--spacing) * 1);
      }
      #top-nav-buttons {
        padding-bottom: calc(var(--spacing) * 2);
        border-bottom-color: color-mix(
          in oklab,
          var(--color-on-surface) 20%,
          transparent
        );
        border-bottom-width: 1px;
        border-bottom-style: solid;
      }
      #bottom-nav-buttons {
        padding-top: calc(var(--spacing) * 2);
        border-top-color: color-mix(
          in oklab,
          var(--color-on-surface) 20%,
          transparent
        );
        border-top-width: 1px;
        border-top-style: solid;
        padding-bottom: calc(var(--spacing) * 2);
      }
      #reading-preferences-button {
        grid-column: 1 / -1; /* full-width first row on narrow screens */
        grid-row: 2;
        padding-block: calc(var(--spacing) * 2);
        padding-inline: calc(var(--spacing) * 4);
        border-radius: var(--border-radius);
        transition-duration: 0.2s;
        color: var(--color-on-surface-strong);
        text-align: center;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        letter-spacing: var(--tracking-wide);
        font-weight: var(--font-weight-medium);
        border-color: color-mix(
          in oklab,
          var(--color-on-surface) 20%,
          transparent
        );
        border-width: 1px;
        border-style: solid;
        background-color: color-mix(
          in oklab,
          var(--color-surface) 30%,
          transparent
        );
        font-size: var(--text-base);
        line-height: var(--text-base--line-height);
      }
      #reading-preferences-button:hover {
        filter: brightness(125%);
      }
      #top-prev-button,
      #top-next-button,
      #bottom-prev-button,
      #bottom-next-button {
        color: var(--color-on-secondary);
        background-color: color-mix(
          in oklab,
          var(--color-surface) 80%,
          transparent
        );
        cursor: not-allowed;
        opacity: 0.55;
        padding-block: calc(var(--spacing) * 2);
        padding-inline: calc(var(--spacing) * 4);
        border-radius: var(--border-radius);
        text-align: center;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        text-decoration: inherit;
        letter-spacing: var(--tracking-wide);
        transition-duration: 0.15s;
        font-weight: var(--font-weight-medium);
      }
      #top-prev-button:hover,
      #top-next-button:hover,
      #bottom-prev-button:hover,
      #bottom-next-button:hover {
        color: var(--color-on-surface-strong);
        filter: brightness(110%);
        box-shadow:
          rgba(0, 0, 0, 0) 0px 0px 0px 0px,
          rgba(0, 0, 0, 0) 0px 0px 0px 0px,
          rgba(0, 0, 0, 0) 0px 0px 0px 0px,
          rgba(0, 0, 0, 0) 0px 0px 0px 0px,
          rgba(0, 0, 0, 0.1) 0px 4px 6px -1px,
          rgba(0, 0, 0, 0.1) 0px 2px 4px -2px;
      }
      #top-prev-button[href],
      #top-next-button[href],
      #bottom-prev-button[href],
      #bottom-next-button[href] {
        color: var(--color-on-primary);
        background-color: var(--color-primary);
        cursor: pointer;
        opacity: 1;
      }
      #top-prev-button[href]:hover,
      #top-next-button[href]:hover,
      #bottom-prev-button[href]:hover,
      #bottom-next-button[href]:hover {
        filter: brightness(110%);
        box-shadow:
          rgba(0, 0, 0, 0) 0px 0px 0px 0px,
          rgba(0, 0, 0, 0) 0px 0px 0px 0px,
          rgba(0, 0, 0, 0) 0px 0px 0px 0px,
          rgba(0, 0, 0, 0) 0px 0px 0px 0px,
          rgba(0, 0, 0, 0.1) 0px 4px 6px -1px,
          rgba(0, 0, 0, 0.1) 0px 2px 4px -2px;
      }
      #top-prev-button {
        grid-column: 1;
        grid-row: 1;
      }
      #top-next-button {
        grid-column: 2;
        grid-row: 1;
      }
      #top-prev-button::after,
      #bottom-prev-button::after {
        content: "⬅ Previous";
      }
      #top-next-button::after,
      #bottom-next-button::after {
        content: "Next ➡";
      }
      #dates {
        display: flex;
        justify-content: flex-end;
        flex-wrap: wrap;
        margin-top: calc(var(--spacing) * -4);
      }
      time {
        color: var(--color-on-surface-muted);
        font-weight: var(--font-weight-light);
        line-height: calc(var(--spacing) * 7);
        margin-left: calc(var(--spacing) * 6);
      }
      #created-date::before {
        content: "🗒";
      }
      #edited-date::before {
        content: "🖉 ";
      }
      @media (min-width: 48rem) {
        #header {
          padding-block: calc(var(--padding) * 5);
          padding-inline: calc(var(--padding) * 8);
          min-height: calc(14rem - var(--padding) * 10);
        }
        #fiction-title {
          h2 {
            font-size: var(--text-2xl);
          }
        }
        #chapter-title {
          h1 {
            font-size: var(--text-3xl);
          }
        }
        #author {
          h4 {
            font-size: var(--text-2xl);
          }
        }
        #body {
          margin-inline: calc(var(--padding) * 6);
          padding-block: calc(var(--spacing) * 6);
          padding-inline: calc(var(--spacing) * 6);
        }
        #top-nav-buttons {
          padding-bottom: calc(var(--spacing) * 4);
        }
        #bottom-nav-buttons {
          padding-top: calc(var(--spacing) * 4);
        }
        #top-prev-button::after,
        #bottom-prev-button::after {
          content: "⬅ Previous Chapter";
        }
        #top-next-button::after,
        #bottom-next-button::after {
          content: "Next Chapter ➡";
        }
      }
      @media (min-width: 64rem) {
        body > div {
          max-width: 64rem;
        }
        #top-nav-buttons {
          grid-template-columns: 1fr auto 1fr;
          align-items: center;
        }
        #reading-preferences-button {
          grid-column: 2;
          grid-row: 1;
        }
        #top-prev-button,
        #top-next-button,
        #bottom-prev-button,
        #bottom-next-button {
          width: calc(var(--spacing) * 45);
        }
        #top-prev-button {
          grid-column: 1;
          grid-row: 1;
          justify-self: start;
        }
        #top-next-button {
          grid-column: 3;
          grid-row: 1;
          justify-self: end;
        }
        #bottom-prev-button {
          justify-self: start;
        }
        #bottom-next-button {
          justify-self: end;
        }
      }
      @media (min-width: 80rem) {
        body > div {
          max-width: 80rem;
        }
      }
    </style>
  </head>
  <body>
    <div>
      <div id="header">
        <a id="fiction-title"><h2></h2></a>
        <a id="chapter-title"><h1></h1></a>
        <a id="author"><h4></h4></a>
      </div>
      <div id="body">
        <div id="top-nav-buttons">
          <button id="reading-preferences-button">Reader Preferences ⚙</button>
          <a id="top-prev-button"></a>
          <a id="top-next-button"></a>
        </div>
        <div id="start-note" hidden></div>
        <div id="chapter-content"></div>
        <div id="end-note" hidden></div>
        <div id="bottom-nav-buttons">
          <a id="bottom-prev-button"></a>
          <a id="bottom-next-button"></a>
        </div>
        <div id="dates">
          <time id="created-date"></time>
          <time id="edited-date"></time>
        </div>
      </div>
    </div>
  </body>
</html>
